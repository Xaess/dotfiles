include theme.conf
shell /usr/bin/fish
font-size 12.0
font_family "JetBrainsMono Nerd Font Propo"
window_padding_width 4 

url_style curly
remember_window_size no

background_opacity 0.96
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_over_opacity 0

cursor_shape block
cursor_trail 3 